name: Weekly affiliate link check

# Runs every Monday morning (UTC) and can also be triggered manually from the
# Actions tab. Checks every Amazon affiliate link on the site (Gear page +
# budget kit builder) and opens/updates a GitHub issue if any of them broke.
# Known placeholder links (categories not yet filled with real products) are
# excluded from "broken" — see scripts/check-affiliate-links.mjs.
on:
  schedule:
    - cron: '0 13 * * 1' # Monday 13:00 UTC
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run affiliate link checker
        id: check
        run: |
          node scripts/check-affiliate-links.mjs || echo "broken=true" >> "$GITHUB_OUTPUT"

      - name: Read report
        id: report
        if: always()
        run: |
          {
            echo 'body<<EOF'
            cat link-check-report.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Find existing report issue
        id: find
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'affiliate-links',
            })
            return issues.data[0]?.number ?? ''
          result-encoding: string

      - name: Open or update issue if links are broken
        if: steps.check.outputs.broken == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `${{ steps.report.outputs.body }}`
            const existing = `${{ steps.find.outputs.result }}`
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(existing),
                body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🔗 Affiliate link check found a broken link',
                body,
                labels: ['affiliate-links'],
              })
            }

      - name: Close report issue if everything is fine now
        if: steps.check.outputs.broken != 'true' && steps.find.outputs.result != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ steps.find.outputs.result }}'),
              state: 'closed',
            })
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ steps.find.outputs.result }}'),
              body: 'All affiliate links are resolving fine again — closing.',
            })

      - name: Upload full report as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: affiliate-link-report
          path: link-check-report.md
